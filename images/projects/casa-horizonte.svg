  <text x="977" y="866" fill="#737468" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.7">PROJETO 01 — 03</text>
  <text x="76" y="920" fill="#4e5048" font-family="Georgia,serif" font-size="25" font-style="italic">Arquitetura para viver com intenção.</text>
