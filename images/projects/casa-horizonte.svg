<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Casa Horizonte — estudo de interface fictício</title>
  <desc id="desc">Página conceitual de arquitetura em tons de pedra com a ilustração geométrica de uma casa voltada para o horizonte.</desc>
  <rect width="1200" height="980" fill="#e9e5dc"/>
  <rect x="0" y="0" width="1200" height="72" fill="#f6f4ef"/>
  <path d="M72 35h27M85.5 21.5v27" stroke="#73755f" stroke-width="2"/>
  <text x="116" y="39" fill="#252721" font-family="Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="2">CASA HORIZONTE</text>
  <text x="790" y="39" fill="#68695f" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">PROJETOS</text>
  <text x="902" y="39" fill="#68695f" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">ESTÚDIO</text>
  <text x="1010" y="39" fill="#68695f" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">CONTATO</text>
  <path d="M72 73h1056" stroke="#d2cec3"/>
  <text x="78" y="161" fill="#727365" font-family="Arial,sans-serif" font-size="10" letter-spacing="2.4">ARQUITETURA CONTEMPORÂNEA · ESTUDO DE CONCEITO</text>
  <text x="72" y="288" fill="#282a24" font-family="Georgia,serif" font-size="88" letter-spacing="-5">Um lugar</text>
  <text x="72" y="376" fill="#282a24" font-family="Georgia,serif" font-size="88" letter-spacing="-5">para <tspan fill="#73755f" font-style="italic">respirar.</tspan></text>
  <text x="78" y="438" fill="#65665d" font-family="Arial,sans-serif" font-size="14">Espaços pensados para acompanhar a vida,</text>
  <text x="78" y="461" fill="#65665d" font-family="Arial,sans-serif" font-size="14">com tempo, luz e materiais honestos.</text>
  <rect x="78" y="505" width="175" height="48" fill="#282a24"/>
  <text x="101" y="534" fill="#f6f4ef" font-family="Arial,sans-serif" font-size="11" letter-spacing=".7">CONHEÇA O ESTÚDIO</text>
  <path d="M230 529h10m-4-4 4 4-4 4" fill="none" stroke="#f6f4ef" stroke-width="1.2"/>
