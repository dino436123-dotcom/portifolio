<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Orla — estudo de interface fictício para café</title>
  <desc id="desc">Página escura de um café de origem com tipografia clara, detalhes em laranja e uma ilustração gráfica de uma xícara de café.</desc>
  <rect width="1200" height="980" fill="#29251f"/>
  <rect x="0" y="0" width="1200" height="74" fill="#24211c"/>
  <text x="72" y="45" fill="#f0eadf" font-family="Georgia,serif" font-size="27" font-style="italic">orla.</text>
  <text x="690" y="42" fill="#c8c0b2" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">NOSSO CAFÉ</text>
  <text x="815" y="42" fill="#c8c0b2" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">DE ONDE VEM</text>
  <text x="967" y="42" fill="#c8c0b2" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">ENCONTRE A ORLA</text>
