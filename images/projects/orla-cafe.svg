  <text x="72" y="279" fill="#f3eee4" font-family="Georgia,serif" font-size="88" letter-spacing="-5">Seu tempo,</text>
  <text x="72" y="366" fill="#f3eee4" font-family="Georgia,serif" font-size="88" font-style="italic" letter-spacing="-5">bem passado.</text>
  <text x="78" y="432" fill="#c2bbae" font-family="Arial,sans-serif" font-size="14">Grãos especiais, escolhidos perto de onde nascem.</text>
  <text x="78" y="456" fill="#c2bbae" font-family="Arial,sans-serif" font-size="14">Para fazer a pausa valer o caminho.</text>
  <rect x="78" y="507" width="169" height="48" fill="#d5a36a"/>
